# Reusable frontend checks (typecheck, lint, build, Vitest, Playwright e2e).
# Called from web.yml when changes touch web/server paths, and from ci.yml on release
# (workflow_call) so master image publish still waits on web tests.
name: Web checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web-typecheck-lint-build:
    name: web-typecheck-lint-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Build
        run: npm run build

  web-vitest:
    name: web-vitest (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # UTC plus the household's zone (restores the Vitest run the
        # America/Denver job in ci.yml had before #488).
        tz: [UTC, America/Denver]
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest --run

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Poppler (pdftoppm for print ruler e2e)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build server binary
        run: go build -o ../bin/stockbot-server ../cmd/server

      # One worker, zero retries, Chromium only. Spec order: contrast-a11y and
      # shopping-list share suite DB state; run them before the rest.
      - name: Run contrast-a11y then shopping-list in order
        run: npx playwright test e2e/contrast-a11y.spec.ts e2e/shopping-list.spec.ts --workers=1 --retries=0

      - name: Run Playwright e2e tests
        run: npx playwright test $(ls e2e/*.spec.ts | grep -Ev 'e2e/(contrast-a11y|shopping-list)\.spec\.ts') --workers=1 --retries=0

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
