name: Test metrics

# Advisory test calorie density. This file is separate from ci.yml on purpose:
# another change is adding a Denver-timezone job there, and this workflow must
# not collide with it. The numbers never fail the build and never block merge.
on:
  pull_request:
  schedule:
    # Monday 16:00 UTC (10:00 MDT, 09:00 MST).
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-metrics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pull_request merge ref is built against one base commit. The event's
  # base.sha can be an older or newer master by the time the jobs start, and
  # comparing those two trees counts other pull requests as this change.
  # Pin both SHAs once, from that merge commit, and measure exactly those trees.
  pin:
    name: Pin the measured commits
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      head_sha: ${{ steps.pin.outputs.head_sha }}
      base_sha: ${{ steps.pin.outputs.base_sha }}
    steps:
      - name: Checkout the commit this run measures
        uses: actions/checkout@v7
        with:
          # Depth 2 keeps the merge commit's first parent. On pull_request the
          # default ref is refs/pull/N/merge. Other events check out their SHA.
          fetch-depth: 2

      - name: Record the measured commit and its first parent
        id: pin
        run: |
          set +e
          head_sha=$(git rev-parse HEAD)
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          base_sha=""
          if git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
            base_sha=$(git rev-parse "HEAD^1")
          else
            subject=$(git log -1 --format=%s)
            if [[ "$subject" =~ ^Merge[[:space:]]+[0-9a-f]{40}[[:space:]]+into[[:space:]]+([0-9a-f]{40})$ ]]; then
              base_sha="${BASH_REMATCH[1]}"
              echo "::warning::The merge parent was not in the shallow history; using the SHA named in the merge subject."
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
              echo "::warning::Could not read the merge parent; falling back to the event base SHA."
            fi
          fi
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "Measuring ${head_sha} against base ${base_sha}"
          git log -1 --format='%H %s'
          exit 0

  script-tests:
    name: Count-tests script
    runs-on: ubuntu-latest
    # A broken counter should be visible, and it still must not block merge.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run counting, exclusion, and diff tests
        run: python3 scripts/count_tests_test.py

  measure-head:
    name: Metrics (head)
    needs: pin
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      # The pinned SHA is the merge commit on a pull request, and the branch
      # SHA on schedule and workflow_dispatch.
      - name: Checkout the tree to measure
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.head_sha }}
          path: repo
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: repo/go.mod
          cache: true
          cache-dependency-path: repo/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: repo/frontend/.nvmrc
          cache: npm
          cache-dependency-path: repo/frontend/package-lock.json

      - name: Collect coverage and write the report
        id: collect
        run: |
          set +e
          out="${RUNNER_TEMP}/test-metrics"
          bash repo/scripts/collect-test-metrics.sh repo "$out" repo/scripts/count-tests.py
          status=$?
          echo "out=$out" >> "$GITHUB_OUTPUT"
          if [ -s "$out/metrics.json" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::metrics.json was not written (collect exited ${status})"
          fi
          exit 0

      - name: Publish the densities on the job summary
        if: steps.collect.outputs.ok == 'true'
        run: |
          {
            echo "## Test calorie density (head)"
            echo
            echo 'Advisory only. This job does not fail the build.'
            echo
            echo '```'
            cat "${{ steps.collect.outputs.out }}/metrics.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the metrics JSON
        if: steps.collect.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'pull_request' && 'test-metrics-head' || 'test-metrics' }}
          path: |
            ${{ steps.collect.outputs.out }}/metrics.json
            ${{ steps.collect.outputs.out }}/metrics.txt
            ${{ steps.collect.outputs.out }}/status.json
          retention-days: 30
          if-no-files-found: warn

  measure-base:
    name: Metrics (base)
    needs: pin
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    steps:
      # First parent of the merge commit, not pull_request.base.sha.
      - name: Checkout the base tree
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.base_sha }}
          path: repo
          fetch-depth: 1

      # The base commit does not have this script until the change is merged.
      # Use the same pinned merge commit Metrics (head) measures.
      - name: Checkout the script from the merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.head_sha }}
          path: tooling
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: repo/go.mod
          cache: true
          cache-dependency-path: repo/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: repo/frontend/.nvmrc
          cache: npm
          cache-dependency-path: repo/frontend/package-lock.json

      - name: Collect coverage and write the report
        id: collect
        run: |
          set +e
          out="${RUNNER_TEMP}/test-metrics"
          bash tooling/scripts/collect-test-metrics.sh repo "$out" tooling/scripts/count-tests.py
          status=$?
          echo "out=$out" >> "$GITHUB_OUTPUT"
          if [ -s "$out/metrics.json" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::metrics.json was not written (collect exited ${status})"
          fi
          exit 0

      - name: Publish the densities on the job summary
        if: steps.collect.outputs.ok == 'true'
        run: |
          {
            echo "## Test calorie density (base)"
            echo
            echo 'Advisory only. This job does not fail the build.'
            echo
            echo '```'
            cat "${{ steps.collect.outputs.out }}/metrics.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the metrics JSON
        if: steps.collect.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-metrics-base
          path: |
            ${{ steps.collect.outputs.out }}/metrics.json
            ${{ steps.collect.outputs.out }}/metrics.txt
            ${{ steps.collect.outputs.out }}/status.json
          retention-days: 30
          if-no-files-found: warn

  comment:
    name: Sticky pull request comment
    needs: [script-tests, pin, measure-head, measure-base]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      # Same two commits the measure jobs ran, so flag C line numbers match
      # the reports even if master moves while this workflow is in progress.
      - name: Checkout the measured head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.head_sha }}
          path: head
          fetch-depth: 1

      - name: Checkout the measured base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.base_sha }}
          path: base
          fetch-depth: 1

      - name: Download the two reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: test-metrics-*
          path: artifacts

      - name: Build one sticky comment
        if: always()
        run: |
          set +e
          comment="${RUNNER_TEMP}/comment.md"
          base_json="artifacts/test-metrics-base/metrics.json"
          head_json="artifacts/test-metrics-head/metrics.json"
          if [ -s "$base_json" ] && [ -s "$head_json" ]; then
            python3 head/scripts/count-tests.py diff \
              "$base_json" "$head_json" \
              --base-repo base --head-repo head \
              --markdown "$comment" --json "${RUNNER_TEMP}/delta.json"
          fi
          if [ ! -s "$comment" ] || ! grep -q 'stockbot-test-metrics' "$comment"; then
            printf '%s\n\n%s\n' \
              '<!-- stockbot-test-metrics -->' \
              '**Test calorie density** could not be computed for this pull request. The check is advisory and does not fail the build or block merge.' \
              > "$comment"
          fi
          {
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$comment"
          echo "COMMENT_PATH=$comment" >> "$GITHUB_ENV"
          exit 0

      - name: Post or update the sticky comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- stockbot-test-metrics -->'
            let body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            if (!body.includes(marker)) {
              body = marker + '\n\n' + body
            }
            const head = context.payload.pull_request.head
            if (head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.notice('Fork pull request: the token cannot write a comment. The metrics artifact is still uploaded.')
              return
            }
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const sticky = comments.filter(comment => (comment.body || '').includes(marker))
            if (sticky.length === 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
              return
            }
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: sticky[0].id,
              body,
            })
            for (const extra of sticky.slice(1)) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: extra.id })
              } catch (err) {
                core.notice(`Left an older metrics comment in place: ${err.message}`)
              }
            }

      - name: Advisory check always succeeds
        if: always()
        run: exit 0
