name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      go_cross_platform:
        description: >-
          Also run Go compile checks on macOS and Windows. Linux always runs on
          every trigger (PR, release, and manual runs).
        type: boolean
        required: false
        default: false
      publish_image:
        description: Manual CI runs never publish images; leave at skip.
        type: string
        required: false
        default: skip
  workflow_call:
    inputs:
      # String, not boolean. pull_request and workflow_dispatch set this via inputs
      # (manual dispatch defaults to skip). workflow_call default is publish so
      # release.yml can reuse this workflow without a with: block.
      publish_image:
        description: Pass skip to avoid building and pushing the container image.
        type: string
        required: false
        default: publish
      go_cross_platform:
        description: >-
          Also run Go compile checks on macOS and Windows. Linux always runs.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Install bc (required by coverage script)
        run: sudo apt-get update && sudo apt-get install -y bc
      
      - name: Run Go tests with coverage
        run: ./scripts/test-coverage.sh
  
  go-build-linux:
    name: Go build on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  go-build-macos:
    name: Go build on macos-latest
    # inputs is only defined for workflow_dispatch/workflow_call; never read it on pull_request.
    if: >-
      github.event_name != 'pull_request' &&
      (inputs.go_cross_platform == true || inputs.go_cross_platform == 'true')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  go-build-windows:
    name: Go build on windows-latest
    if: >-
      github.event_name != 'pull_request' &&
      (inputs.go_cross_platform == true || inputs.go_cross_platform == 'true')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

  shell:
    name: Shell script linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: Lint deploy shell scripts
        run: shellcheck deploy/setup.sh deploy/systemd/pantry-update.sh deploy/systemd/pantry-backup.sh deploy/setup_apply_test.sh deploy/pantry_update_test.sh deploy/publish-mode.sh deploy/check-publish-modes.sh deploy/check-deploy-hook.sh deploy/runtime-setup.sh deploy/backup/install.sh deploy/backup/restore-drill.sh deploy/backup/install_test.sh deploy/backup/restore-drill_test.sh deploy/backup/pantry-backup_test.sh deploy/backup/timer_test.sh scripts/check-stockbot-names.sh scripts/publish-moving-tags.sh scripts/publish-moving-tags_test.sh

      - name: Setup script syntax and behavior
        run: bash -n deploy/setup.sh deploy/systemd/pantry-update.sh deploy/systemd/pantry-backup.sh deploy/publish-mode.sh deploy/check-publish-modes.sh deploy/check-deploy-hook.sh deploy/runtime-setup.sh deploy/backup/install.sh deploy/backup/restore-drill.sh deploy/pantry_update_test.sh scripts/publish-moving-tags.sh scripts/publish-moving-tags_test.sh && bash deploy/setup_apply_test.sh && bash deploy/pantry_update_test.sh && bash deploy/backup/install_test.sh && bash deploy/backup/restore-drill_test.sh && bash deploy/backup/pantry-backup_test.sh && bash deploy/backup/timer_test.sh && bash scripts/publish-moving-tags_test.sh

      - name: Publish modes compose config and Caddyfile adapt
        run: bash deploy/check-publish-modes.sh

      - name: Deploy hook contract
        run: bash deploy/check-deploy-hook.sh

      - name: Module path and names that stay pantry
        run: bash scripts/check-stockbot-names.sh

      - name: Validate CI Linux-default platform matrix
        run: python3 scripts/validate_ci_platform_matrix.py && python3 scripts/validate_ci_platform_matrix_test.py

      - name: Firmware host unit tests
        run: bash firmware/run_host_tests.sh

  firmware-pio:
    name: Firmware PlatformIO (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - sticks3_u173
          - atoms3lite_u173_bench
          - atoms3lite_symcode_hid
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: platformio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini', 'firmware/boards/**', 'firmware/data/cert/**') }}
          restore-keys: |
            platformio-${{ runner.os }}-${{ matrix.env }}-
            platformio-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

  web-checks:
    # Pull requests use the Web workflow (change detection + aggregator). Release
    # calls this workflow on master push (github.event_name is push, not workflow_call).
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/web-checks.yml

  denver:
    name: America/Denver tests
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: go test ./...

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build server binary
        working-directory: frontend
        run: go build -o ../bin/stockbot-server ../cmd/server

      - name: Run shopping-list e2e
        working-directory: frontend
        run: npx playwright test e2e/shopping-list.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-denver
          path: frontend/playwright-report
          retention-days: 7

  watch-worker:
    name: Watch worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/watch-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: deploy/watch-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    # Pull requests verify the multi-arch Dockerfile without waiting for e2e.
    if: inputs.publish_image != 'skip' && github.event_name == 'pull_request' && github.repository == 'Rhionin/stockbot'
    concurrency:
      group: image-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          TAGS="ghcr.io/rhionin/pantry:${{ github.sha }}"
          SIDECAR="ghcr.io/rhionin/pantry-grocy-sync:${{ github.sha }}"
          BRANCH_NAME="${HEAD_REF}"
          BRANCH_NAME="${BRANCH_NAME#refs/heads/}"
          BRANCH_NAME="${BRANCH_NAME//\//-}"
          TAGS="$TAGS,ghcr.io/rhionin/pantry:$BRANCH_NAME"
          SIDECAR="$SIDECAR,ghcr.io/rhionin/pantry-grocy-sync:$BRANCH_NAME"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "sidecar_tags=$SIDECAR" >> "$GITHUB_OUTPUT"

      - name: Read commit identity
        id: commit
        run: |
          short=$(git rev-parse --short=7 HEAD)
          {
            echo "time=$(git log -1 --format=%cI)"
            echo "subject_b64=$(git log -1 --format=%s | tr -d '\r\n' | base64 -w 0)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=v$(date -u +%Y%m%d)-${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=pantry
          cache-to: type=gha,mode=max,scope=pantry
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
            COMMIT_SUBJECT_B64=${{ steps.commit.outputs.subject_b64 }}
            BUILD_TIME=${{ steps.commit.outputs.built_at }}
            VERSION=${{ steps.commit.outputs.version }}

      - name: Build grocy-sync image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.grocy-sync
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=grocy-sync
          cache-to: type=gha,mode=max,scope=grocy-sync
          tags: ${{ steps.tags.outputs.sidecar_tags }}

  docker-publish:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [go, web-checks, shell, denver, watch-worker]
    # Release calls this workflow on master after tests pass. Pull requests use
    # the docker job above so the image build does not wait on e2e.
    # Inside workflow_call, github.event_name is the caller's trigger (push from
    # release.yml), not the string workflow_call.
    if: inputs.publish_image != 'skip' && github.event_name == 'push'
    concurrency:
      group: ${{ github.ref == 'refs/heads/master' && 'deploy-master' || format('image-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="ghcr.io/rhionin/pantry:${{ github.sha }}"
          SIDECAR="ghcr.io/rhionin/pantry-grocy-sync:${{ github.sha }}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "sidecar_tags=$SIDECAR" >> "$GITHUB_OUTPUT"

      - name: Read commit identity
        id: commit
        run: |
          short=$(git rev-parse --short=7 HEAD)
          {
            echo "time=$(git log -1 --format=%cI)"
            echo "subject_b64=$(git log -1 --format=%s | tr -d '\r\n' | base64 -w 0)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=v$(date -u +%Y%m%d)-${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=pantry
          cache-to: type=gha,mode=max,scope=pantry
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
            COMMIT_SUBJECT_B64=${{ steps.commit.outputs.subject_b64 }}
            BUILD_TIME=${{ steps.commit.outputs.built_at }}
            VERSION=${{ steps.commit.outputs.version }}

      - name: Build and push grocy-sync image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.grocy-sync
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=grocy-sync
          cache-to: type=gha,mode=max,scope=grocy-sync
          tags: ${{ steps.tags.outputs.sidecar_tags }}

      - name: Publish moving tags when this commit is still the tip
        id: moving
        if: github.ref == 'refs/heads/master'
        run: bash scripts/publish-moving-tags.sh

      - name: Ask the Stockbot host to deploy
        if: github.ref == 'refs/heads/master' && steps.moving.outputs.publish == 'true'
        env:
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          if [ -z "${DEPLOY_HOOK_SECRET}" ]; then
            echo "DEPLOY_HOOK_SECRET is not set; skipping the deploy hook. The Pi timer will pull this image."
            exit 0
          fi
          body="{\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF_NAME}\"}"
          ts="$(date +%s)"
          sig="$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$DEPLOY_HOOK_SECRET" -hex | awk '{print $NF}')"
          post_hook() {
            curl --fail --silent --show-error --max-time 30 \
              -X POST "$1" \
              -H "Content-Type: application/json" \
              -H "X-Pantry-Deploy-Timestamp: ${ts}" \
              -H "X-Pantry-Deploy-Signature: ${sig}" \
              --data-binary "$body"
          }
          if post_hook "https://stockbot.rhionin.com/api/deploy-hook"; then
            echo "Deploy hook accepted for ${GITHUB_SHA}."
          elif post_hook "https://pantry.rhionin.com/api/deploy-hook"; then
            echo "Deploy hook accepted on the previous host for ${GITHUB_SHA}."
          else
            echo "Deploy hook failed for https://stockbot.rhionin.com and https://pantry.rhionin.com."
            exit 1
          fi