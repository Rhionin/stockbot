name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      # String, not boolean. On push and pull_request this input is unset, and
      # a boolean's zero value is false, which would skip the only publisher.
      # Release passes skip. Any other value, including unset, still publishes.
      publish_image:
        description: Pass skip to avoid building and pushing the container image.
        type: string
        required: false
        default: publish

permissions:
  contents: read
  packages: write

jobs:
  go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Install bc (required by coverage script)
        run: sudo apt-get update && sudo apt-get install -y bc
      
      - name: Run Go tests with coverage
        run: ./scripts/test-coverage.sh
  
  go-build-all-platforms:
    name: Go build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Build all packages
        run: go build ./...

  shell:
    name: Shell script linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: Lint deploy shell scripts
        run: shellcheck deploy/setup.sh deploy/systemd/pantry-update.sh deploy/systemd/pantry-backup.sh deploy/setup_apply_test.sh deploy/pantry_update_test.sh deploy/publish-mode.sh deploy/check-publish-modes.sh deploy/check-deploy-hook.sh deploy/runtime-setup.sh deploy/backup/install.sh deploy/backup/restore-drill.sh deploy/backup/install_test.sh deploy/backup/restore-drill_test.sh deploy/backup/pantry-backup_test.sh deploy/backup/timer_test.sh scripts/check-stockbot-names.sh scripts/publish-moving-tags.sh scripts/publish-moving-tags_test.sh

      - name: Setup script syntax and behavior
        run: bash -n deploy/setup.sh deploy/systemd/pantry-update.sh deploy/systemd/pantry-backup.sh deploy/publish-mode.sh deploy/check-publish-modes.sh deploy/check-deploy-hook.sh deploy/runtime-setup.sh deploy/backup/install.sh deploy/backup/restore-drill.sh deploy/pantry_update_test.sh scripts/publish-moving-tags.sh scripts/publish-moving-tags_test.sh && bash deploy/setup_apply_test.sh && bash deploy/pantry_update_test.sh && bash deploy/backup/install_test.sh && bash deploy/backup/restore-drill_test.sh && bash deploy/backup/pantry-backup_test.sh && bash deploy/backup/timer_test.sh && bash scripts/publish-moving-tags_test.sh

      - name: Publish modes compose config and Caddyfile adapt
        run: bash deploy/check-publish-modes.sh

      - name: Deploy hook contract
        run: bash deploy/check-deploy-hook.sh

      - name: Module path and names that stay pantry
        run: bash scripts/check-stockbot-names.sh

  frontend:
    name: Frontend tests and linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint code
        run: npm run lint
      
      - name: Run tests
        run: npx vitest --run

  e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build server binary
        run: go build -o ../bin/stockbot-server ../cmd/server

      # One worker, this order. These specs share the suite database, and the
      # full run can hide a leak when another spec resets state between them.
      - name: Run contrast-a11y then shopping-list in order
        run: npx playwright test e2e/contrast-a11y.spec.ts e2e/shopping-list.spec.ts --workers=1

      - name: Run Playwright e2e tests
        run: npx playwright test
      
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  denver:
    name: America/Denver tests
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: go test ./...

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npx vitest --run

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build server binary
        working-directory: frontend
        run: go build -o ../bin/stockbot-server ../cmd/server

      - name: Run shopping-list e2e
        working-directory: frontend
        run: npx playwright test e2e/shopping-list.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-denver
          path: frontend/playwright-report
          retention-days: 7

  watch-worker:
    name: Watch worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/watch-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: deploy/watch-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [go, frontend, shell, e2e, denver, watch-worker]
    # One publisher per master commit. Release reuses this workflow, and the
    # github context there is still the caller's push, so event_name cannot
    # tell the two runs apart. The reusable run passes publish_image skip
    # and skips this job. The push-triggered run is the only one that tags
    # :latest and :master, and the only one that calls the deploy hook below.
    #
    # Master publishes share deploy-master so two merges cannot push :latest
    # at the same time. queue: max keeps every waiting publish (up to
    # GitHub's limit of 100). Jobs join this group when their tests finish,
    # not in push order, so the default single waiting slot would let an
    # older commit cancel the newest publish that is already waiting.
    # cancel-in-progress is false: the build that has started finishes and
    # still pushes its immutable sha tag. Pull requests and the Release
    # skip use a unique group so they do not queue behind production.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.publish_image != 'skip' && 'deploy-master' || format('image-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    if: inputs.publish_image != 'skip' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.repository == 'Rhionin/stockbot'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          # Branch names are untrusted. Keep the value in the environment so
          # it cannot break out of the script.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Always push the immutable commit tag. Moving tags are applied
          # later, and only when this commit is still the tip of master.
          TAGS="ghcr.io/rhionin/pantry:${{ github.sha }}"
          SIDECAR="ghcr.io/rhionin/pantry-grocy-sync:${{ github.sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${HEAD_REF}"
            # Remove 'refs/heads/' prefix if present
            BRANCH_NAME="${BRANCH_NAME#refs/heads/}"
            # Replace slashes with dashes for valid tag
            BRANCH_NAME="${BRANCH_NAME//\//-}"
            TAGS="$TAGS,ghcr.io/rhionin/pantry:$BRANCH_NAME"
            SIDECAR="$SIDECAR,ghcr.io/rhionin/pantry-grocy-sync:$BRANCH_NAME"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "sidecar_tags=$SIDECAR" >> "$GITHUB_OUTPUT"

      - name: Read commit identity
        id: commit
        run: |
          # Same commit the image is tagged with (github.sha / the checkout).
          # Base64 keeps the subject a single build-arg: quotes and spaces
          # never reach the Dockerfile, where $$ would be the shell PID.
          # version matches the annotated tag in release.yml: v<UTC date>-<7 char sha>.
          short=$(git rev-parse --short=7 HEAD)
          {
            echo "time=$(git log -1 --format=%cI)"
            echo "subject_b64=$(git log -1 --format=%s | tr -d '\r\n' | base64 -w 0)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=v$(date -u +%Y%m%d)-${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=pantry
          cache-to: type=gha,mode=max,scope=pantry
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
            COMMIT_SUBJECT_B64=${{ steps.commit.outputs.subject_b64 }}
            BUILD_TIME=${{ steps.commit.outputs.built_at }}
            VERSION=${{ steps.commit.outputs.version }}

      - name: Build and push grocy-sync image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.grocy-sync
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=grocy-sync
          cache-to: type=gha,mode=max,scope=grocy-sync
          tags: ${{ steps.tags.outputs.sidecar_tags }}

      # The sha tags are already in the registry. Move :latest and :master
      # only when this commit is still the tip, so a slower older build
      # cannot overwrite the tag pantry-update.timer pulls.
      - name: Publish moving tags when this commit is still the tip
        id: moving
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/publish-moving-tags.sh

      # The image is already in the registry. This asks the Pi to pull it now.
      # The step is a no-op until DEPLOY_HOOK_SECRET exists, so a repo without
      # that secret still publishes the image and the Pi timer still deploys.
      # It runs only after the moving tags above were published.
      - name: Ask the Stockbot host to deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.moving.outputs.publish == 'true'
        env:
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          if [ -z "${DEPLOY_HOOK_SECRET}" ]; then
            echo "DEPLOY_HOOK_SECRET is not set; skipping the deploy hook. The Pi timer will pull this image."
            exit 0
          fi
          body="{\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF_NAME}\"}"
          ts="$(date +%s)"
          sig="$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$DEPLOY_HOOK_SECRET" -hex | awk '{print $NF}')"
          post_hook() {
            curl --fail --silent --show-error --max-time 30 \
              -X POST "$1" \
              -H "Content-Type: application/json" \
              -H "X-Pantry-Deploy-Timestamp: ${ts}" \
              -H "X-Pantry-Deploy-Signature: ${sig}" \
              --data-binary "$body"
          }
          # Primary host is stockbot. The previous name still answers until
          # the tunnel route and the Pi env have both moved.
          if post_hook "https://stockbot.rhionin.com/api/deploy-hook"; then
            echo "Deploy hook accepted for ${GITHUB_SHA}."
          elif post_hook "https://pantry.rhionin.com/api/deploy-hook"; then
            echo "Deploy hook accepted on the previous host for ${GITHUB_SHA}."
          else
            echo "Deploy hook failed for https://stockbot.rhionin.com and https://pantry.rhionin.com."
            exit 1
          fi