# Frontend typecheck, lint, build, Vitest (UTC + America/Denver), and Playwright e2e.
# Runs on every pull_request (no branches: filter — includes stacked PRs whose
# base is another feature branch) and on push to master. A changes job decides
# whether to invoke web-checks from the diff since the previous push (on
# synchronize) or since the PR base / push before commit. Matched paths include
# frontend/, shared/, cmd/, internal/, testdata/, docs/release-notes/ (not all
# docs/ — e.g. docs/release-notes/2026-10-25.md matches, docs/other.md does not),
# go.mod/go.sum, and web workflow files. The web-required aggregator always
# aggregator always reports "Web checks passed" so branch protection can require
# one check without deadlocking Go-only PRs.
name: Web

on:
  # Intentionally no branches: filter (contrast ci.yml pull_request → master only).
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  changes:
    name: Detect web-relevant changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect web-relevant changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          pattern='^(frontend/|shared/|cmd/|internal/|testdata/|go\.(mod|sum)$|\.github/workflows/web(-checks)?\.yml$)'
          from="${BASE}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "synchronize" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              from=$(git rev-parse HEAD~1)
            fi
          fi
          if [ -z "${from}" ] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$from" "$HEAD" | grep -Eq "$pattern"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  web-checks:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/web-checks.yml

  web-required:
    name: Web checks passed
    runs-on: ubuntu-latest
    needs: [changes, web-checks]
    if: always()
    steps:
      - name: Require successful web gate
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job result: ${{ needs.changes.result }}"
            exit 1
          fi
          case "${{ needs.web-checks.result }}" in
            success|skipped) ;;
            *)
              echo "web-checks job result: ${{ needs.web-checks.result }}"
              exit 1
              ;;
          esac
