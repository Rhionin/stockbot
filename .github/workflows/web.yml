# Frontend typecheck, lint, build, Vitest (UTC + America/Denver), and Playwright e2e.
# Runs on every pull_request (no branches: filter — stacked PRs included) and on
# push to master. Web checks always run (no path filter), matching the old ci.yml
# frontend job on every PR. The web-required aggregator reports "Web checks passed"
# for branch protection.
name: Web

on:
  # Intentionally no branches: filter (contrast ci.yml pull_request → master only).
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/web-checks.yml

  web-required:
    name: Web checks passed
    runs-on: ubuntu-latest
    needs: [web-checks]
    if: always()
    steps:
      - name: Require successful web gate
        run: |
          case "${{ needs.web-checks.result }}" in
            success) ;;
            *)
              echo "web-checks job result: ${{ needs.web-checks.result }}"
              exit 1
              ;;
          esac
