[package]
name = "stockbot-scanner-esp"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 scanner firmware target (issue #445 slice S7)"

[[bin]]
name = "stockbot-scanner-esp"
harness = false

[features]
default = []
# USB serial console stands in for the barcode reader, screen, buzzer, power gauge and captive
# portal until the driver tickets (#741 to #745) replace each stand-in. Every target turns it on
# because CI builds with `--no-default-features --features <target>`; release builds (#452) will
# drop it once the drivers land.
bench-serial = []
sticks3_u173 = ["bench-serial"]
sticks3_u173_uart = ["bench-serial"]
atoms3lite_u173_bench = ["bench-serial"]
atoms3lite_symcode_hid = ["bench-serial"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
opt-level = "z"
debug = true

[dependencies]
stockbot-scanner-core = { path = "../stockbot-scanner-core" }
log = { version = "=0.4.27", default-features = false }
esp-idf-svc = { version = "=0.51.0", default-features = true, features = ["std"] }
# Panel driver for the StickS3 screen (#742); rust-version 1.75, embedded-hal 1.0, embedded-graphics 0.8.
mipidsi = { version = "=0.9.0" }

[build-dependencies]
embuild = { version = "=0.33.0", default-features = false, features = ["espidf"] }

[lints.rust]
unsafe_code = "forbid"