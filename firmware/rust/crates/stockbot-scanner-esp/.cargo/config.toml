[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# ESP-IDF path/version come from `espup install` (sourced in CI via export-esp.sh).
# Custom partition CSV paths in sdkconfig are resolved from esp-idf-sys's CMake `out/` tree,
# not the crate manifest dir — copy the committed table there before the IDF build.
ESP_IDF_GLOB_PARTITION_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_PARTITION_CSV = "partitions_8mb_ota.csv"