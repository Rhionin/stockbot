; Stockbot ESP32-S3 unified scanner firmware (Setup A, bench, Setup B)

[platformio]
default_envs = sticks3_u173
src_dir = src

[env]
platform = espressif32@6.9.0
framework = arduino
board_build.partitions = partitions_8mb_ota.csv
board_build.filesystem = littlefs
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
lib_deps =
  m5stack/M5Unified@^0.2.2
  m5stack/M5GFX@^0.2.5
  bblanchon/ArduinoJson@^7.2.1

[env:sticks3_u173]
board = m5stack-sticks3
build_flags =
  ${env.build_flags}
  -Iinclude
  -DSTOCKBOT_ENV_STICKS3_U173=1
  -DU173_I2C_ADDR=0x21

[env:sticks3_u173_uart_split]
extends = env:sticks3_u173
build_flags =
  ${env:sticks3_u173.build_flags}
  -DU173_UART_SPLIT_PIN_MODE=1

[env:atoms3lite_u173_bench]
board = m5stack-atoms3
build_flags =
  ${env.build_flags}
  -Iinclude
  -DSTOCKBOT_ENV_ATOMS3_BENCH=1
  -DU173_I2C_ADDR=0x21
  -DU120_I2C_ADDR=0x3E

[env:atoms3lite_symcode_hid]
board = m5stack-atoms3
build_flags =
  ${env.build_flags}
  -Iinclude
  -DSTOCKBOT_ENV_ATOMS3_SYMcode_HID=1
  -DU120_I2C_ADDR=0x3E

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror
  -Isrc/core
build_src_filter =
  +<core/*>
test_build_project_src = true
test_filter = test_scanner_core
