<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scan with the phone camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,560;6..72,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <main class="screen">
    <header class="top">
      <img src="assets/mark.svg" alt="">
      <div class="word">Scan</div>
      <div class="clock">9:41</div>
    </header>
    <div class="body">
      <h1>Point at the barcode</h1>
      <p class="lede">The camera is the free scanner. Nothing has to stay on in the pantry.</p>
      <div class="finder" aria-hidden="true">
        <img class="can" src="assets/can.svg" alt="">
        <div class="sights">
          <span class="tl"></span>
          <span class="tr"></span>
          <span class="bl"></span>
          <span class="br"></span>
        </div>
        <div class="captured">
          <div class="bar"></div>
          <div>
            <strong>Black beans</strong>
            <span>012345678905 · stock in</span>
          </div>
          <span class="pill">Full</span>
        </div>
      </div>
      <div class="shelf">
        <div class="person">
          <div class="mark low"></div>
          <div>
            <strong>Oat milk</strong>
            <div class="meta">1 left · target 3</div>
          </div>
          <span class="pill amber">Low</span>
        </div>
        <div class="person">
          <div class="mark out"></div>
          <div>
            <strong>Pasta</strong>
            <div class="meta">None on the shelf</div>
          </div>
          <span class="pill out">Out</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
