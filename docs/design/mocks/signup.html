<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Start a household</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,560;6..72,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <main class="screen">
    <header class="top">
      <img src="assets/mark.svg" alt="">
      <div class="word">Stockbot</div>
      <div class="clock">9:41</div>
    </header>
    <div class="body">
      <h1>Start a household</h1>
      <p class="lede">One pantry for the people who share a kitchen. Each person gets their own login.</p>
      <label>Your name
        <input value="CJ Campbell" aria-label="Your name">
      </label>
      <label>Email
        <input value="cj@example.com" aria-label="Email">
      </label>
      <label>Household name
        <input value="Maple Street" aria-label="Household name">
      </label>
      <button type="button">Create household</button>
      <p class="quiet">Next you’ll invite the others. There is no shared password, and nothing to install on a Pi.</p>
    </div>
  </main>
</body>
</html>
