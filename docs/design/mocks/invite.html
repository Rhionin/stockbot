<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invite a member</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,560;6..72,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <main class="screen">
    <header class="top">
      <img src="assets/mark.svg" alt="">
      <div class="word">Maple Street</div>
      <div class="clock">9:41</div>
    </header>
    <div class="body">
      <h1>Invite someone</h1>
      <p class="lede">They’ll have their own login for this pantry. They won’t see any other household.</p>
      <label>Email
        <input value="alex@example.com" aria-label="Email">
      </label>
      <button type="button">Send invite</button>
      <div class="person row">
        <div>
          <strong>alex@example.com</strong>
          <div class="meta">Invite sent · expires in 7 days</div>
        </div>
        <span class="pill amber">Pending</span>
      </div>
      <div class="person row">
        <div>
          <strong>CJ Campbell</strong>
          <div class="meta">cj@example.com</div>
        </div>
        <span class="pill">Owner</span>
      </div>
      <p class="quiet">Removing someone takes away their login and their scan alerts. The pantry stays.</p>
    </div>
  </main>
</body>
</html>
